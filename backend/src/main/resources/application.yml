spring:
  application:
    name: gist-backend
  datasource:
    url: ${GIST_DB_URL:jdbc:postgresql://localhost:5433/gist}
    username: ${GIST_DB_USER:gist}
    password: ${GIST_DB_PASSWORD:gist}
  jpa:
    # Flyway owns the schema; Hibernate only checks the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # A ~2h recording straight off a phone, before ffmpeg shrinks it.
      max-file-size: 200MB
      max-request-size: 210MB

server:
  # 0.0.0.0 so a phone on the same Wi-Fi can reach the API, not just localhost.
  address: 0.0.0.0
  port: 8080

gist:
  storage:
    # Where converted audio is kept. Relative to the backend working directory.
    dir: ${GIST_STORAGE_DIR:./storage}
  ffmpeg:
    # On PATH here; overridable because the winget install path carries a
    # build number that changes on upgrade.
    path: ${GIST_FFMPEG_PATH:ffmpeg}
    probe-path: ${GIST_FFPROBE_PATH:ffprobe}
  audio:
    # Hard ceiling. Bitrate adapts to fit Groq's 25MB cap (64kbps up to
    # ~49 min, sliding down to ~29kbps at 110 min).
    max-duration-minutes: 110
  encryption:
    # Base64 of 32 random bytes. Startup fails if absent or weak.
    key: ${GIST_ENCRYPTION_KEY:}
  auth:
    # Base64 of 32+ random bytes; signs session tokens. Startup fails if absent.
    # Changing it signs everyone out.
    jwt-secret: ${GIST_JWT_SECRET:}
    # How long a sign-in lasts before the app asks for the password again.
    session-days: 30
    # Failed password attempts per email within 15 minutes before lockout.
    max-failed-logins: 10
  mail:
    api-key: ${RESEND_API_KEY:}
    from: ${GIST_MAIL_FROM:Gist <onboarding@resend.dev>}
    base-url: https://api.resend.com
    max-recipients: 10
    sends-per-hour: 20
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    transcription-model: ${GIST_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
    summarization-model: ${GIST_SUMMARIZATION_MODEL:openai/gpt-oss-120b}

logging:
  level:
    org.flywaydb: info
