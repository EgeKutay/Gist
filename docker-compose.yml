# Local development database. Host port 5433: 5432 is taken by the machine-wide
# PostgreSQL 18 service, which this project does not touch.
# No auth phase, so the credentials are trivial
# and deliberately not secrets.
services:
  postgres:
    image: postgres:17-alpine
    container_name: gist-postgres
    environment:
      POSTGRES_DB: gist
      POSTGRES_USER: gist
      POSTGRES_PASSWORD: gist
    ports:
      - "5433:5432"
    volumes:
      - gist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gist -d gist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gist-pgdata:
